  utter_contraception:
    - text: "Les méthodes de contraception comprennent la pilule, le stérilet, le préservatif, et plus encore."
    - text: "La contraception d'urgence est une méthode pour prévenir une grossesse après un rapport non protégé."
    - text: "Les effets secondaires des contraceptifs peuvent inclure des nausées, des maux de tête ou des changements d'humeur."
    - text: "Le stérilet est généralement efficace et dure entre 5 et 10 ans."
    - text: "La pilule contraceptive doit être prise tous les jours à la même heure."
    - text: "Le préservatif est une méthode fiable pour prévenir les IST et les grossesses non désirées."
    - text: "Les implants contraceptifs sont une méthode à long terme très efficace."
    - text: "La pilule du lendemain est utilisée après un rapport sexuel non protégé pour éviter une grossesse."

  utter_pourquoi_douleurs_regles:
    - text: "Les douleurs menstruelles sont causées par la contraction de l'utérus pour expulser la muqueuse. Essayez des médicaments anti-inflammatoires pour les soulager."
    - text: "Les crampes menstruelles sont fréquentes et peuvent être atténuées par des remèdes naturels ou médicaux."
    - text: "Les douleurs peuvent être provoquées par des changements hormonaux. Si cela persiste, consultez un médecin."
    - text: "Certaines femmes éprouvent des douleurs plus intenses en raison de conditions médicales spécifiques."
    - text: "Les douleurs menstruelles sont courantes et peuvent être réduites avec des exercices de relaxation."
    - text: "Des douleurs pendant les règles peuvent indiquer un besoin de consultation médicale, surtout si elles sont intenses."
    - text: "Les crampes sont causées par les contractions utérines, vous pouvez les atténuer avec de la chaleur et des analgésiques."
    - text: "Il est normal d'avoir un peu de douleur pendant les règles, mais un excès peut signaler un problème de santé."
    - text: "Certains troubles, comme l'endométriose, peuvent causer des douleurs. Consultez un spécialiste si cela est récurrent."
    - text: "Des médicaments comme l'ibuprofène peuvent aider à réduire les douleurs liées aux contractions utérines."

  utter_regles_irregulieres:
    - text: "Les règles irrégulières sont fréquentes chez les jeunes femmes et peuvent s'harmoniser avec le temps."
    - text: "Des cycles irréguliers peuvent être dus au stress ou à des changements hormonaux."
    - text: "Il est courant d'avoir des règles irrégulières au début. Consultez un médecin si cela vous inquiète."
    - text: "Les règles irrégulières peuvent avoir diverses causes, dont le stress ou l'alimentation."
    - text: "Le cycle menstruel peut prendre du temps pour se régulariser, en particulier chez les adolescentes."
    - text: "Consultez un professionnel si vos règles sont souvent irrégulières, cela peut être lié aux hormones."
    - text: "Les règles irrégulières sont courantes mais si elles persistent, une consultation médicale est conseillée."
    - text: "Des règles irrégulières peuvent indiquer un déséquilibre hormonal ou d'autres conditions médicales."
    - text: "Les changements de cycle peuvent être influencés par de nombreux facteurs, dont le stress."
    - text: "Pour certaines femmes, les règles irrégulières sont normales. Un médecin peut vous donner plus d'informations."

  utter_soulager_douleurs_regles:
    - text: "Pour soulager les douleurs, vous pouvez essayer des médicaments ou appliquer une bouillotte sur le bas ventre."
    - text: "Certaines postures de yoga peuvent aider à diminuer les douleurs menstruelles."
    - text: "Des analgésiques comme l'ibuprofène peuvent être efficaces pour atténuer la douleur."
    - text: "Les remèdes naturels comme le thé au gingembre peuvent également soulager les crampes."
    - text: "Le repos et les exercices de relaxation peuvent aider à diminuer les douleurs."
    - text: "Consultez votre médecin pour des solutions adaptées si les douleurs sont trop fréquentes."
    - text: "Appliquer de la chaleur sur le bas-ventre peut apaiser les douleurs menstruelles."
    - text: "Des massages doux sur l'abdomen peuvent également atténuer la douleur."
    - text: "Essayez de boire beaucoup d'eau pour rester hydraté et réduire les crampes."
    - text: "Évitez le stress et reposez-vous, cela peut contribuer à réduire les douleurs."

  utter_duree_regles:
    - text: "La durée moyenne des règles est entre 3 et 7 jours, mais cela peut varier."
    - text: "En général, les règles durent environ une semaine."
    - text: "Certaines femmes ont des règles plus courtes, tandis que d'autres durent jusqu'à 7 jours."
    - text: "Un cycle de règles normales dure entre 3 et 5 jours, bien que cela puisse varier."
    - text: "Il est normal que les règles durent quelques jours de plus ou de moins selon les individus."
    - text: "Des règles prolongées peuvent indiquer un problème de santé, consultez un médecin si nécessaire."
    - text: "Si vos règles durent plus de 7 jours, il est préférable de consulter un spécialiste."
    - text: "Certaines variations sont normales, mais si cela persiste, consultez un professionnel."
    - text: "En moyenne, les règles ne dépassent pas une semaine."
    - text: "Les règles très courtes ou très longues peuvent parfois indiquer des déséquilibres hormonaux."

  utter_demander_symptomes_dernieres_regles:
    - text: "Pour mieux comprendre la situation, pourriez-vous me donner plus de détails ? Quels symptômes ressentez-vous ? Et à quand remontent vos dernières règles ?"
    - text: "Pouvez-vous me dire quels sont vos symptômes actuels et quand vous avez eu vos dernières règles ?"
    - text: "Pour mieux évaluer, pourriez-vous partager la date de vos dernières règles et les symptômes que vous ressentez actuellement ?"
    - text: "Merci de préciser vos derniers symptômes et la date de vos dernières règles afin de vous guider plus efficacement."

  utter_arret_reprise_regles:
    - text: "Il est possible que vos règles s'arrêtent puis reprennent, mais si cela est fréquent, consultez un médecin."
    - text: "Des interruptions de saignement peuvent arriver, mais parlez-en à un spécialiste si cela devient récurrent."
    - text: "Un arrêt temporaire des règles suivi d'une reprise est parfois normal, mais restez vigilante."
    - text: "Les saignements intermittents peuvent être dus à des variations hormonales."
    - text: "Parfois, les règles semblent se stopper et reprendre, mais si cela persiste, consultez un professionnel."
    - text: "Cela peut arriver à certaines femmes, mais n'hésitez pas à consulter si cela vous inquiète."
    - text: "Des fluctuations hormonales peuvent expliquer les interruptions dans le cycle menstruel."
    - text: "Un arrêt soudain des règles suivi d'une reprise n'est pas inhabituel, mais parlez-en à un médecin."
    - text: "Ce phénomène peut se produire et n'est pas toujours alarmant, mais n'hésitez pas à en parler."
    - text: "Les pauses dans les règles peuvent arriver. Consultez si cela devient anormalement fréquent."

  utter_infection_sexuellement_transmissible:
    - text: "Une infection sexuellement transmissible (IST) est une infection qui se transmet principalement lors de rapports sexuels non protégés."
    - text: "Les symptômes courants des IST incluent des douleurs, des écoulements anormaux ou des démangeaisons."
    - text: "Pour se protéger contre les IST, l'utilisation de préservatifs est fortement recommandée."
    - text: "Certaines IST peuvent être asymptomatiques, ce qui rend le dépistage important."
    - text: "Le test de dépistage pour les IST permet de détecter des infections avant qu'elles ne causent des dommages."

  utter_grossesse:
    - text: "Les premiers signes de grossesse incluent un retard de règles, des nausées et une sensibilité des seins."
    - text: "Un test de grossesse peut être effectué à la maison après un retard de règles ou chez un médecin."
    - text: "Le test de grossesse à domicile est fiable, mais il peut parfois être faux si effectué trop tôt."
    - text: "Si vous êtes enceinte, il est important de consulter un médecin pour démarrer un suivi de grossesse."
    - text: "Il existe plusieurs options en cas de grossesse non désirée, telles que l'avortement ou l'adoption."

  utter_déséquilibre_hormonal:
    - text: "Un déséquilibre hormonal peut provoquer des symptômes comme des règles irrégulières, de l'acné, ou des troubles de l'humeur."
    - text: "Le stress peut affecter l'équilibre hormonal et perturber le cycle menstruel."
    - text: "Les examens hormonaux permettent de vérifier l'équilibre de vos hormones, notamment la testostérone, l'œstrogène, et la progestérone."
    - text: "Une mauvaise alimentation peut aussi influencer les niveaux hormonaux."
    - text: "Les plantes comme le fenouil ou le gattilier peuvent être utiles pour rééquilibrer naturellement les hormones."

  utter_ménopause:
    - text: "La ménopause se produit généralement entre 45 et 55 ans, lorsqu'une femme arrête d'avoir ses règles."
    - text: "Les symptômes de la ménopause incluent des bouffées de chaleur, des sueurs nocturnes et une baisse de libido."
    - text: "Il est possible de traiter les symptômes de la ménopause avec des médicaments ou des changements de mode de vie."
    - text: "Certaines femmes continuent à avoir des règles irrégulières pendant la périménopause avant de complètement les arrêter."
    - text: "La ménopause peut affecter la densité osseuse, augmentant le risque de fractures."

  utter_préconception:
    - text: "Pour se préparer à une grossesse, il est important de prendre des vitamines prénatales et de consulter un médecin."
    - text: "L'âge, l'alimentation et la santé générale influencent la fertilité chez la femme."
    - text: "Il est recommandé de consulter un médecin avant de concevoir pour vérifier la santé reproductive."
    - text: "Les jours fertiles varient, mais vous pouvez calculer vos jours de fertilité à l'aide d'une application ou d'un test d'ovulation."
    - text: "Il est conseillé d'arrêter la contraception et d'attendre que votre cycle menstruel se régule avant de concevoir."

  utter_douleurs_pelviennes:
    - text: "Les douleurs pelviennes peuvent avoir plusieurs causes, y compris les règles, les infections ou des troubles comme l'endométriose."
    - text: "Si vos douleurs pelviennes sont sévères ou constantes, il est important de consulter un médecin."
    - text: "Les douleurs pelviennes peuvent être soulagées par des analgésiques, des exercices ou des compresses chaudes."
    - text: "Si les douleurs pelviennes affectent votre fertilité, une consultation médicale est nécessaire."

  utter_avortement:
    - text: "Un avortement est une procédure médicale pour mettre fin à une grossesse non désirée."
    - text: "L'avortement peut être réalisé par médication ou par intervention chirurgicale, selon la durée de la grossesse."
    - text: "Il est important de consulter un médecin avant de décider d'un avortement."
    - text: "L'avortement est légal dans de nombreux pays, mais les lois varient."
    - text: "Après un avortement, un suivi médical est essentiel pour s'assurer de la bonne récupération."

  utter_infections_vaginales:
    - text: "Les infections vaginales peuvent être causées par des champignons, des bactéries ou des virus."
    - text: "Les symptômes incluent des démangeaisons, des pertes anormales et des douleurs lors des rapports."
    - text: "Pour traiter une infection vaginale, il existe des médicaments antifongiques ou antibiotiques."
    - text: "Le port de vêtements trop serrés peut augmenter le risque d'infections vaginales."
    - text: "Il est conseillé de consulter un médecin pour identifier la cause de l'infection vaginale."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
